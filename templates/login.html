<!DOCTYPE html>
<html>
<head>
    <title>Login Finance System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #5b86e5;
            --secondary: #36d1dc;
        }

        body {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            min-height: 100vh;
        }

        .card {
            border-radius: 14px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 134, 229, 0.1);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #4a6ec2;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <form method="POST" class="card p-4 shadow" style="width: 380px;" id="loginForm">

        <h4 class="text-center mb-2 fw-bold">💰 Finance System</h4>
        <p class="text-center text-muted mb-4">Reimburse & Purchase Order</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{category}} py-2 alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
        {% endwith %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>
                <input type="text" name="username" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password" id="password" class="form-control" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePass">
                    👁
                </button>
            </div>
        </div>

        <button class="btn btn-primary w-100" id="btnLogin">
            Login
        </button>

    </form>

</div>

<script>
const toggle = document.getElementById("togglePass");
const pass = document.getElementById("password");
const form = document.getElementById("loginForm");
const btn = document.getElementById("btnLogin");

toggle.addEventListener("click", () => {
    pass.type = pass.type === "password" ? "text" : "password";
});

form.addEventListener("submit", () => {
    btn.innerText = "Loading...";
    btn.disabled = true;
});
</script>

</body>
</html>
